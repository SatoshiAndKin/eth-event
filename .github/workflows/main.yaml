on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # daily at 0:00 UTC
  workflow_dispatch:

name: main workflow

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }}, 3.${{ matrix.pyminor }}, ${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    env:
      TOX_RECREATE_FLAG: ${{ github.event_name == 'schedule' && '-r' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        pyminor: [ "10", "11", "12", "13", "14", "14t" ]
        architecture: [x64, x86]
        exclude:
          # Exclude x86 (32-bit) builds for macos, which doesn't support 32-bit at all
          - os: macos-latest
            architecture: x86

    steps:
    - uses: actions/checkout@v4

    # No architecture specified for MacOS
    - name: Set up Python (macos)
      if: ${{ matrix.os == 'macos-latest' }}
      uses: actions/setup-python@v5
      with:
        python-version: 3.${{ matrix.pyminor }}
        cache: pip
        cache-dependency-path: |
          setup.py
          setup.cfg
          pyproject.toml
          tox.ini
          requirements.txt
          requirements-dev.in
          requirements-dev.txt

    # Windows uses both x86 and x64 Python.
    - name: Set up Python
      if: ${{ matrix.os == 'windows-latest' }}
      uses: actions/setup-python@v5
      with:
        python-version: 3.${{ matrix.pyminor }}
        architecture: ${{ matrix.architecture }}
        cache: pip
        cache-dependency-path: |
          setup.py
          setup.cfg
          pyproject.toml
          tox.ini
          requirements.txt
          requirements-dev.in
          requirements-dev.txt

    - name: Install Tox
      run: pip install -U tox

    - name: Cache tox environment
      uses: actions/cache@v4
      with:
        path: .tox
        key: ${{ runner.os }}-core-${{ hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'pyproject.toml', 'tox.ini', 'requirements.txt', 'requirements-dev.in', 'requirements-dev.txt') }}-3.${{ matrix.pyminor }}
        save-always: ${{ env.TOX_RECREATE_FLAG == '-r' }}

    - name: Run Tox
      run: tox -e py3${{ matrix.pyminor }} ${{ env.TOX_RECREATE_FLAG }}

    - name: Upload coverage to Codecov
      if: ${{ matrix.architecture == 'x64' }}
      uses: codecov/codecov-action@v1
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  linux:
    permissions:
      contents: read
    uses: SatoshiAndKin/eth-event/.github/workflows/main-reviewed-linux.yaml@ede8dbd1ce7a923f00a6d3b53a1021267fb6d7fe
