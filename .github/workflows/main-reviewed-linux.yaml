name: Reviewed Linux main checks

on:
  workflow_call:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  linting:
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          setup.py
          setup.cfg
          pyproject.toml
          tox.ini
          requirements.txt
          requirements-dev.in
          requirements-dev.txt

    - name: Cache tox environment
      uses: actions/cache@v4
      with:
        path: .tox
        key: k3s-${{ runner.os }}-linting-${{ hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'pyproject.toml', 'tox.ini', 'requirements.txt', 'requirements-dev.in', 'requirements-dev.txt') }}
        save-always: ${{ env.TOX_RECREATE_FLAG == '-r' }}

    - name: Install Tox
      run: pip install tox

    - name: Run Tox
      run: tox -e lint ${{ env.TOX_RECREATE_FLAG }}

  core:
    name: core (${{ matrix.os }}, 3.${{ matrix.pyminor }}, ${{ matrix.architecture }})
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    env:
      TOX_RECREATE_FLAG: ${{ github.event_name == 'schedule' && '-r' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        pyminor: [ "10", "11", "12", "13", "14", "14t" ]
        architecture: [x64]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.${{ matrix.pyminor }}
        architecture: ${{ matrix.architecture }}
        cache: pip
        cache-dependency-path: |
          setup.py
          setup.cfg
          pyproject.toml
          tox.ini
          requirements.txt
          requirements-dev.in
          requirements-dev.txt

    - name: Install Tox
      run: pip install -U tox

    - name: Cache tox environment
      uses: actions/cache@v4
      with:
        path: .tox
        key: k3s-${{ runner.os }}-core-${{ hashFiles('pyproject.toml', 'setup.py', 'setup.cfg', 'pyproject.toml', 'tox.ini', 'requirements.txt', 'requirements-dev.in', 'requirements-dev.txt') }}-3.${{ matrix.pyminor }}
        save-always: ${{ env.TOX_RECREATE_FLAG == '-r' }}

    - name: Run Tox
      run: tox -e py3${{ matrix.pyminor }} ${{ env.TOX_RECREATE_FLAG }}

    - name: Upload coverage to Codecov
      if: ${{ matrix.architecture == 'x64' }}
      uses: codecov/codecov-action@v1
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
