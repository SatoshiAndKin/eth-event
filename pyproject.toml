[build-system]
requires = [
    "setuptools",
    "wheel",
    "mypy[mypyc] @ git+https://github.com/SatoshiAndKin/mypy.git@24a9987f6c48b9c75e23ec597114faf5e745bb89",
    "faster-eth-abi @ git+https://github.com/SatoshiAndKin/faster-eth-abi.git@c47ee635c91c476f906c62249bdd5f18603f0dc4",
    "faster-hexbytes @ git+https://github.com/SatoshiAndKin/faster-hexbytes.git@677ae29fce0f7f1049515bb7207a0702e7d013ad",
]


# Black configuration

# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.

[tool.black]
line-length = 100
target-version = ['py36', 'py37', 'py38']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | env
  | venv
)/
'''
